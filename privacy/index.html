<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TOMIX — документы</title>
<!-- Короткая страница-указатель: открывает документ на главной.
     Нужна для хостингов, которые не умеют отдавать index.html на
     произвольный адрес (например, GitHub Pages). -->
<meta http-equiv="refresh" content="0; url=/?doc=privacy">
<link rel="canonical" href="/privacy">
</head>
<body>
<p>Открываем документ… Если ничего не произошло,
<a href="/?doc=privacy">нажмите сюда</a>.</p>
<script>location.replace("/?doc=privacy");</script>
</body>
</html>
